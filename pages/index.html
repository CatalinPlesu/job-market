<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moldova Job Market Board</title>
    <meta name="description" content="Comprehensive job listings from all major Moldovan job sites">
    <meta name="keywords" content="jobs, employment, Moldova, Chisinau, careers">
    
    <!-- SEO Meta Tags -->
    <meta property="og:title" content="Moldova Job Market Board">
    <meta property="og:description" content="Find the best job opportunities across Moldova">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-domain.github.io">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💼</text></svg>">
    
    <!-- Tailwind CSS + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Mithril.js -->
    <script src="https://unpkg.com/mithril@2.2.2/mithril.js"></script>
    
    <!-- Lodash for debouncing -->
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
    
    <!-- Custom Styles -->
    <style>
        .job-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .job-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .filter-group.active {
            border-left: 3px solid hsl(var(--p));
        }
        
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <!-- Load modules in order -->
    <script type="module">
        // Import core modules
        import { FilterManager, FilterUtils } from './js/core/filters.js';
        import { BrowserAPI } from './js/core/api.js';
        
        // Make available globally for components
        window.FilterManager = FilterManager;
        window.FilterUtils = FilterUtils;
        window.BrowserAPI = BrowserAPI;
        
        // Initialize API and filter manager
        window.api = new BrowserAPI();
        window.filterManager = new FilterManager(window.api);
        
        // Load main app after core modules
        import('./js/main.js').then(module => {
            // Main app will initialize Mithril
            console.log('App loaded');
        });
    </script>
</body>
</html>
